name: Build APK

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:  # allow manual run from Actions tab

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Gradle 8.5
        run: |
          curl -sL https://services.gradle.org/distributions/gradle-8.5-bin.zip -o /tmp/gradle.zip
          sudo unzip -q /tmp/gradle.zip -d /opt
          echo "/opt/gradle-8.5/bin" >> $GITHUB_PATH
          gradle -v

      - name: Generate Gradle Wrapper
        run: |
          # Always regenerate so we have the complete wrapper (scripts + jar)
          gradle wrapper --gradle-version 8.5
          chmod +x gradlew
          ls -la gradlew gradle/wrapper/

      - name: Build Debug APK
        run: ./gradlew assembleDebug --stacktrace --no-daemon

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: SimpleIncredibox-debug
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 90

      - name: Show APK info
        run: |
          echo "=== APK files ==="
          find app/build/outputs -name "*.apk" -exec ls -lh {} \;
